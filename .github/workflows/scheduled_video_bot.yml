name: Kids Mystery Quiz Video Bot 24/7 Cloud

on:
  schedule:
    # 4 Golden Slots (VN Time): 03:15, 07:15, 19:15, 23:15
    # Converted to UTC: 20:15, 00:15, 12:15, 16:15
    # Dual-Trigger Zero-Miss Architecture:
    # - Minute :15: Primary scheduled trigger
    # - Minute :45: Automated backup fallback trigger (if GitHub Actions scheduler queue is congested at :15)
    # --check-freshness ensures that if :15 already produced a video, :45 exits cleanly in 2 seconds.
    - cron: '15,45 0,12,16,20 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, OpenCV & Kids Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 fonts-comic-neue fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Cloud Credentials
        env:
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_SECRET_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_BASE64" | base64 -d > client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.json
          fi

      - name: Run Kids Mystery Video Pipeline
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # If social credentials exist, publish with --upload; otherwise local render preview
          # --check-freshness prevents duplicate videos within 90 minutes
          if [ -n "$FB_ACCESS_TOKEN" ] || [ -f "youtube_token.json" ]; then
            python main.py --run-now --upload --check-freshness
          else
            python main.py --run-now --check-freshness
          fi

      - name: Commit Updated Quiz History & Engagement
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_kids_quiz.json history_comment_replies.json assets/kids_characters/
          git commit -m "chore: record newly generated quiz to history [skip ci]" || echo "No history changes to commit"
          git push origin main || echo "Push skipped"

      - name: Ephemeral Preview Artifact (Auto-deleted after 2 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-kids-video
          path: output/*.mp4
          retention-days: 2 # Keeps cloud disk 100% clean and free
