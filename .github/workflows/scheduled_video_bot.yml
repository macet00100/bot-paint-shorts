name: Kids Mystery Quiz Video Bot 24/7 Cloud

on:
  schedule:
    # 4 Viral International Time Slots (converted to UTC):
    # 03:00 AM VN = 20:00 UTC (04:00 PM US EDT - Kids After-School Rush)
    # 07:00 AM VN = 00:00 UTC (08:00 PM US EDT - Prime Time Evening Scroll)
    # 07:00 PM VN = 12:00 UTC (08:00 AM US EDT - Morning commute / Europe afternoon)
    # 11:00 PM VN = 16:00 UTC (12:00 PM US EDT - Midday lunch break peak)
    - cron: '0 0,12,16,20 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg, OpenCV & Kids Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1 fonts-comic-neue fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Cloud Credentials
        env:
          YOUTUBE_CLIENT_SECRET_BASE64: ${{ secrets.YOUTUBE_CLIENT_SECRET_BASE64 }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TIKTOK_SESSION_COOKIE: ${{ secrets.TIKTOK_SESSION_COOKIE }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_SECRET_BASE64" ]; then
            echo "$YOUTUBE_CLIENT_SECRET_BASE64" | base64 -d > client_secret.json
          fi
          if [ -n "$YOUTUBE_TOKEN_BASE64" ]; then
            echo "$YOUTUBE_TOKEN_BASE64" | base64 -d > youtube_token.json
          fi

      - name: Run Kids Mystery Video Pipeline
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TIKTOK_SESSION_COOKIE: ${{ secrets.TIKTOK_SESSION_COOKIE }}
        run: |
          # If social credentials exist, publish with --upload; otherwise local render preview
          if [ -n "$FB_ACCESS_TOKEN" ] || [ -f "youtube_token.json" ] || [ -n "$TIKTOK_SESSION_COOKIE" ]; then
            python main.py --run-now --upload
          else
            python main.py --run-now
          fi

      - name: Commit Updated Quiz History (Anti-Duplication)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history_kids_quiz.json assets/kids_characters/
          git commit -m "chore: record newly generated quiz to history [skip ci]" || echo "No history changes to commit"
          git push origin main || echo "Push skipped"

      - name: Ephemeral Preview Artifact (Auto-deleted after 2 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-kids-video
          path: output/*.mp4
          retention-days: 2 # Keeps cloud disk 100% clean and free
